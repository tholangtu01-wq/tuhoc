<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Seal -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#sealGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Border -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#fecaca" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Hanzi Character '漢' -->
  <text x="50%" y="64%" font-family="'KaiTi', 'STKaiti', 'PingFang SC', serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">漢</text>
  
  <!-- Golden Seal Accent Dot -->
  <circle cx="410" cy="100" r="14" fill="#fbbf24"/>
</svg>
